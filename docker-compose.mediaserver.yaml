version: "3.9"

services:
  transcoding-service:
    #user: "${UID}:${GID}"
    build:
      context: .
      dockerfile: docker/Backend.Dockerfile
    image: transcoding-service
    container_name: transcoding-service
    environment:
      - MEDIA_DIR=${MEDIA_DIR}
      - REDIS_HOST=redis
      - SERVER_CONFIG_PATH=${SERVER_CONFIG_PATH}
    volumes:
      - /media:/media
      - /media_cache:/media_cache
      - ./configs:/configs
      - ./results:/results
      - type: tmpfs
        target: /media_ram
      - type: tmpfs
        target: /media_cache_ram
    logging:
      driver: "none"
    networks:
      - servernet
    deploy:

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - servernet

  media-server:
    #user: "${UID}:${GID}"
    build:
      context: .
      dockerfile: docker/MediaServer.Dockerfile
    image: media-server
    container_name: media-server
    environment:
      - MEDIA_DIR=${MEDIA_DIR}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx/conf.d # default, but explicit is fine
    ports:
      - "8081:8081"  
    volumes:
      - /media:/media:ro
      #- ./src/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    logging:
      driver: "none"
    networks:
      - servernet
    depends_on:
      - transcoding-service

networks:
  servernet: